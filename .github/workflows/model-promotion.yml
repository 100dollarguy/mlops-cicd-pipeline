name: Promote MLflow Model

on:
  push:
    tags:
      - "promote-v*-from-v*"

permissions:
  contents: read

concurrency:
  group: mlflow-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate promotion tag
        id: tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^promote-v([0-9]+)-from-v([0-9]+)$ ]]; then
            echo "Invalid tag: $TAG"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "expected_current=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Verify Python environment
        run: |
          conda run -n mlops-cicd python --version
          conda run -n mlops-cicd python -c "import mlflow; print('MLflow:', mlflow.__version__)"

      - name: Promote validated model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "MLFLOW_TRACKING_URI secret is required."
            exit 1
          fi

          conda run -n mlops-cicd python -m scripts.promote_model \
            --version "${{ steps.tag.outputs.version }}" \
            --expected-current "${{ steps.tag.outputs.expected_current }}" \
            --approve
