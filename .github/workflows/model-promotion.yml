name: Promote MLflow Model

on:
  push:
    tags:
      - "promote-v*-from-v*"

permissions:
  contents: read

concurrency:
  group: mlflow-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate promotion tag
        id: tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^promote-v([0-9]+)-from-v([0-9]+)$ ]]; then
            echo "Invalid tag: $TAG"
            echo "Expected: promote-v<target>-from-v<expected-production>"
            exit 1
          fi

          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "expected_current=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Promote validated model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "Repository secret MLFLOW_TRACKING_URI is required."
            exit 1
          fi

          python -m scripts.promote_model \
            --version "${{ steps.tag.outputs.version }}" \
            --expected-current "${{ steps.tag.outputs.expected_current }}" \
            --approve
